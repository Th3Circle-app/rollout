# Rollout engine — STAGING. Identical to fly.toml except the app name, so you can
# deploy + smoke-test a change here before promoting the same code to prod.
# Scale-to-zero keeps idle cost ≈ $0.  Deploy:  cd backend && fly deploy -c fly.staging.toml

app = "rollout-engine-staging"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  HF_HOME = "/root/.cache/huggingface"
  TORCH_HOME = "/root/.cache/torch"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 8
    soft_limit = 4

[[vm]]
  size = "shared-cpu-4x"
  memory = "8gb"

[mounts]
  source = "rollout_models_staging"
  destination = "/root/.cache"
